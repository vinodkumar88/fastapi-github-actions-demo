apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-app
  namespace: test
  labels:
    app: fastapi-app
    env: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi-app
  template:
    metadata:
      labels:
        app: fastapi-app
        env: test
    spec:
      containers:
        - name: fastapi-app
          image: ghcr.io/vinodkumar88/fastapi-github-actions-demo:test
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              value: "test"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

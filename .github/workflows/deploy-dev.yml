# Deploys to the 'dev' K8s namespace — ONLY after CI completes successfully.
# This avoids the race condition where deploy runs before the image is pushed.
name: Deploy to Dev

on:
  workflow_run:
    workflows: ["CI"]        # must match the 'name:' field in ci.yml exactly
    branches: [dev]
    types: [completed]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  # Gate: bail out immediately if CI failed or was cancelled
  check-ci:
    name: Check CI passed
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - run: echo "CI passed — proceeding with deploy"

  deploy:
    name: Deploy → dev namespace
    needs: check-ci
    runs-on: self-hosted
    environment: dev
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Re-tag the SHA image as :dev and push
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag image as :dev
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker tag  ghcr.io/${{ github.repository }}:${{ github.sha }} \
                      ghcr.io/${{ github.repository }}:dev
          docker push ghcr.io/${{ github.repository }}:dev

      # Apply K8s manifests (runner already has kubectl + kubeconfig on the VM)
      - name: Apply manifests to dev namespace
        run: |
          kubectl apply -f k8s/dev/deployment.yaml
          kubectl apply -f k8s/dev/service.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/fastapi-app -n dev --timeout=120s

      - name: Smoke test
        run: |
          sleep 5
          curl -sf http://localhost:30081/health | grep '"status":"ok"'
          echo "Dev smoke test passed"

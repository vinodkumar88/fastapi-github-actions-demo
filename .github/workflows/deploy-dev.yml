# Deploys to the 'dev' K8s namespace automatically on every push to dev branch
name: Deploy to Dev

on:
  push:
    branches: [dev]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy → dev namespace
    runs-on: self-hosted
    environment: dev
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Re-tag the SHA image as :dev and push
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag image as :dev
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker tag  ghcr.io/${{ github.repository }}:${{ github.sha }} \
                      ghcr.io/${{ github.repository }}:dev
          docker push ghcr.io/${{ github.repository }}:dev

      # Apply K8s manifests (runner already has kubectl + kubeconfig on the VM)
      - name: Apply manifests to dev namespace
        run: |
          kubectl apply -f k8s/dev/deployment.yaml
          kubectl apply -f k8s/dev/service.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/fastapi-app -n dev --timeout=120s

      - name: Smoke test
        run: |
          sleep 5
          curl -sf http://localhost:30081/health | grep '"status":"ok"'
          echo "Dev smoke test passed"

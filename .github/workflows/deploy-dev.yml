# Dev pipeline — single workflow file (CI + deploy in one).
# Triggered on every push to dev branch.
# Auto-deploys after lint + build — no approval gate needed for dev.
name: Deploy to Dev

on:
  push:
    branches: [dev]

concurrency:
  group: deploy-dev
  cancel-in-progress: true      # cancel older runs if a new push arrives

jobs:
  # ── 1. Lint ────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run linter
        run: ruff check app/

  # ── 2. Build & push image ──────────────────────────────────
  build-and-push:
    name: Build & push image
    runs-on: self-hosted
    needs: lint
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (SHA tag)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

  # ── 3. Deploy to dev (auto — no approval gate) ─────────────
  deploy:
    name: Deploy → dev namespace
    runs-on: self-hosted
    needs: build-and-push
    environment: dev
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag image as :dev
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker tag  ghcr.io/${{ github.repository }}:${{ github.sha }} \
                      ghcr.io/${{ github.repository }}:dev
          docker push ghcr.io/${{ github.repository }}:dev

      - name: Apply manifests to dev namespace
        run: |
          kubectl apply -f k8s/dev/deployment.yaml
          kubectl apply -f k8s/dev/service.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/fastapi-app -n dev --timeout=120s

      - name: Smoke test
        run: |
          sleep 5
          curl -sf http://localhost:30081/health | grep '"status":"ok"'
          echo "Dev smoke test passed ✅"

      - name: Write deployment summary
        run: |
          echo "### Dev deploy complete" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Time: $(date -u)" >> $GITHUB_STEP_SUMMARY

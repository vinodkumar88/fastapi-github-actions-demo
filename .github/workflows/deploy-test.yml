# Deploys to the 'test' K8s namespace automatically on push to test branch
name: Deploy to Test

on:
  push:
    branches: [test]

concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy → test namespace
    runs-on: self-hosted
    environment: test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag image as :test
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker tag  ghcr.io/${{ github.repository }}:${{ github.sha }} \
                      ghcr.io/${{ github.repository }}:test
          docker push ghcr.io/${{ github.repository }}:test

      - name: Apply manifests to test namespace
        run: |
          kubectl apply -f k8s/test/deployment.yaml
          kubectl apply -f k8s/test/service.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/fastapi-app -n test --timeout=120s

      - name: Smoke test
        run: |
          sleep 5
          curl -sf http://localhost:30082/health | grep '"status":"ok"'
          echo "Test smoke test passed"

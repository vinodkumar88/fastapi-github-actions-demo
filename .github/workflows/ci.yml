# ci.yml — runs on feature branches and PRs only.
# For dev/test/prod branches, CI is embedded inside the deploy workflows.
name: CI

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches: [dev]

jobs:
  lint:
    name: Lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run linter
        run: ruff check app/

  build:
    name: Build image (no push)
    runs-on: self-hosted
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (validate only)
        run: docker build -t fastapi-app:pr-test .

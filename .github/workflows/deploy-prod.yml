# Deploys to prod namespace — PAUSES for manual approval in GitHub UI
# Set up: Repo → Settings → Environments → prod → Required reviewers → add yourself
name: Deploy to Prod

on:
  push:
    branches: [prod]

# Never cancel a running prod deploy
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy → prod namespace
    runs-on: self-hosted
    # This line is what triggers the approval gate.
    # Without a click in GitHub UI this job will sit and wait (up to 30 days).
    environment: prod
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag image as :prod
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker tag  ghcr.io/${{ github.repository }}:${{ github.sha }} \
                      ghcr.io/${{ github.repository }}:prod
          docker push ghcr.io/${{ github.repository }}:prod

      - name: Apply manifests to prod namespace
        run: |
          kubectl apply -f k8s/prod/deployment.yaml
          kubectl apply -f k8s/prod/service.yaml

      - name: Wait for rolling update to complete
        run: |
          kubectl rollout status deployment/fastapi-app -n prod --timeout=180s

      - name: Production smoke test
        run: |
          sleep 5
          curl -sf http://localhost:30083/health | grep '"status":"ok"'
          echo "Production smoke test passed"

      - name: Write deployment summary
        run: |
          echo "### Production deploy complete" >> $GITHUB_STEP_SUMMARY
          echo "Deployed by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Time: $(date -u)" >> $GITHUB_STEP_SUMMARY

  rollback-on-failure:
    name: Rollback if smoke test fails
    runs-on: self-hosted
    needs: deploy
    if: failure()
    steps:
      - name: Roll back deployment
        run: |
          echo "Smoke test failed — rolling back prod deployment"
          kubectl rollout undo deployment/fastapi-app -n prod
          kubectl rollout status deployment/fastapi-app -n prod --timeout=120s

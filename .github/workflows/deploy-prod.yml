# Production pipeline — single workflow file.
# Runs CI first, then waits for manual approval, then deploys.
# Using push trigger (not workflow_run) so the branch context is always 'prod',
# which satisfies the environment protection rule.
name: Deploy to Prod

on:
  push:
    branches: [prod]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # ── 1. Lint ────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run linter
        run: ruff check app/

  # ── 2. Build & push image ──────────────────────────────────
  build-and-push:
    name: Build & push image
    runs-on: self-hosted
    needs: lint
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (SHA tag)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

  # ── 3. Deploy to prod (approval gate fires here) ───────────
  # GitHub pauses this job and emails the required reviewer.
  # The job runs in the context of the 'prod' branch push,
  # so the environment protection rule is satisfied.
  deploy:
    name: Deploy → prod namespace
    runs-on: self-hosted
    needs: build-and-push        # image must exist before we deploy
    environment: prod            # ← triggers approval gate
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag image as :prod
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker tag  ghcr.io/${{ github.repository }}:${{ github.sha }} \
                      ghcr.io/${{ github.repository }}:prod
          docker push ghcr.io/${{ github.repository }}:prod

      - name: Apply manifests to prod namespace
        run: |
          kubectl apply -f k8s/prod/deployment.yaml
          kubectl apply -f k8s/prod/service.yaml

      - name: Wait for rolling update to complete
        run: |
          kubectl rollout status deployment/fastapi-app -n prod --timeout=180s

      - name: Production smoke test
        run: |
          sleep 5
          curl -sf http://localhost:30083/health | grep '"status":"ok"'
          echo "Production smoke test passed"

      - name: Write deployment summary
        run: |
          echo "### 🚀 Production deploy complete" >> $GITHUB_STEP_SUMMARY
          echo "Deployed by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Time: $(date -u)" >> $GITHUB_STEP_SUMMARY

  # ── 4. Auto-rollback if smoke test fails ──────────────────
  rollback-on-failure:
    name: Rollback if smoke test fails
    runs-on: self-hosted
    needs: deploy
    if: failure()
    steps:
      - name: Roll back deployment
        run: |
          echo "Smoke test failed — rolling back prod"
          kubectl rollout undo deployment/fastapi-app -n prod
          kubectl rollout status deployment/fastapi-app -n prod --timeout=120s
